                className="px-6 py-2.5 rounded-xl text-xs font-bold bg-brand-500 text-navy-950"
              >
                Plan a Trip Now
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {savedTrips.map((trip) => (
                <div
                  key={trip.id}
                  className="glass-card rounded-3xl overflow-hidden border border-slate-800 flex flex-col justify-between glass-card-hover group"
                >
                  <div>
                    {/* Cover image */}
                    <div className="relative h-44 w-full">
                      <img
                        src={trip.destinationDetails?.image || 'https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?auto=format&fit=crop&w=600&q=80'}
                        alt={trip.destination}
                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-navy-950 via-navy-950/20 to-transparent"></div>
                      <div className="absolute top-3 right-3 px-3 py-1 rounded-full text-[10px] font-bold bg-navy-950/80 text-brand-300 border border-brand-500/30">
                        {trip.status || 'Upcoming'}
                      </div>
                      <div className="absolute bottom-3 left-4 right-4">
                        <h3 className="text-xl font-bold font-heading text-white">{trip.destination}</h3>
                        <p className="text-xs text-slate-300">{trip.durationDays} Days • ₹{trip.totalBudget.toLocaleString('en-IN')}</p>
                      </div>
                    </div>

                    {/* Metadata body */}
                    <div className="p-5 space-y-3 text-xs">
                      <div className="flex flex-wrap gap-1.5">
                        <span className="px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 capitalize font-medium">
                          {trip.travelerType}
                        </span>
                        <span className="px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 capitalize font-medium">
                          {trip.travelStyle} style
                        </span>
                      </div>
                      <p className="text-slate-400 line-clamp-2 leading-relaxed">
                        {trip.summary}
                      </p>
                    </div>
                  </div>

                  {/* Actions */}
                  <div className="p-5 pt-0">
                    <div className="pt-3 border-t border-slate-800 flex items-center justify-between">
                      <button
                        onClick={() => onViewTrip(trip)}
                        className="px-4 py-2 rounded-xl text-xs font-bold bg-brand-500 text-navy-950 hover:bg-brand-400 flex items-center gap-1.5 transition-colors"
                      >
                        <Icon name="eye" className="w-3.5 h-3.5" />
                        <span>View Plan</span>
                      </button>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => onEditTrip(trip)}
                          className="p-2 rounded-xl bg-navy-900 border border-slate-800 text-slate-300 hover:text-white"
                          title="Edit in Planner"
                        >
                          <Icon name="edit-2" className="w-3.5 h-3.5" />
                        </button>
                        <button
                          onClick={() => onDeleteTrip(trip.id)}
                          className="p-2 rounded-xl bg-navy-900 border border-slate-800 text-slate-400 hover:text-red-400"
                          title="Delete Trip"
                        >
                          <Icon name="trash-2" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // PAGE 7: USER PROFILE & PREFERENCES
    // ==========================================
    // ==========================================
    // PAGE 7: USER PROFILE & PREFERENCES (Full Credentials & Account Creation)
    // ==========================================
    function ProfilePreferencesView({ profile, onUpdateProfile, onPlanTrip }) {
      const fileInputRef = useRef(null);
      const [formData, setFormData] = useState({
        name: profile?.name || 'Rohan Deshmukh',
        email: profile?.email || 'rohan.deshmukh@iitb.ac.in',
        password: profile?.password || 'password123',
        confirmPassword: profile?.password || 'password123',
        avatar: profile?.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80',
        homeCity: profile?.homeCity || 'Pune / Mumbai',
        favoriteDestinations: profile?.favoriteDestinations || ['Goa', 'Manali', 'Kerala', 'Rishikesh'],
        preferredBudget: profile?.preferredBudget || 10000,
        preferredStyle: profile?.preferredStyle || 'budget',
        preferredPace: profile?.preferredPace || 'balanced',
        preferredInterests: profile?.preferredInterests || ['Adventure', 'Nature', 'Hidden Gems', 'Food'],
        aiPersonalizationEnabled: profile?.aiPersonalizationEnabled ?? true,
        totalTripsCount: profile?.totalTripsCount || 4,
        totalBudgetSaved: profile?.totalBudgetSaved || 14200,
        isRegistered: true
      });

      const [showPassword, setShowPassword] = useState(false);
      const [newDestInput, setNewDestInput] = useState('');
      const [validationError, setValidationError] = useState('');
      const [saveSuccessMessage, setSaveSuccessMessage] = useState('');

      const AVATAR_PRESETS = [
        { label: 'Student Backpacker', url: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80' },
        { label: 'Solo Explorer', url: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=200&q=80' },
        { label: 'Culture & Heritage', url: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80' },
        { label: 'Family Leader', url: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=200&q=80' }
      ];

      const ALL_INTERESTS = [
        'Adventure', 'Nature', 'Food', 'History', 'Culture',
        'Shopping', 'Nightlife', 'Photography', 'Relaxation', 'Hidden Gems'
      ];

      // Handle Device File Upload
      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          if (file.size > 6 * 1024 * 1024) {
            setValidationError('Selected image exceeds 6MB limit. Please choose a smaller photo.');
            return;
          }
          const reader = new FileReader();
          reader.onload = (uploadEvent) => {
            const dataUrl = uploadEvent.target.result;
            setFormData((prev) => ({
              ...prev,
              avatar: dataUrl
            }));
            setSaveSuccessMessage('Device photo loaded! Click "Save & Update Profile" to save.');
          };
          reader.readAsDataURL(file);
        }
      };

      // Password strength evaluator
      const passwordStrength = useMemo(() => {
        const p = formData.password || '';
        if (p.length === 0) return { label: 'None', color: 'text-slate-500', bar: 'bg-slate-700', width: 'w-0' };
        if (p.length < 6) return { label: 'Weak', color: 'text-red-400', bar: 'bg-red-500', width: 'w-1/3' };
        if (p.length < 10) return { label: 'Medium', color: 'text-amber-400', bar: 'bg-amber-500', width: 'w-2/3' };
        return { label: 'Strong', color: 'text-emerald-400', bar: 'bg-emerald-500', width: 'w-full' };
      }, [formData.password]);

      const handleTogglePersonalization = () => {
        const nextState = !formData.aiPersonalizationEnabled;
        const updated = { ...formData, aiPersonalizationEnabled: nextState };
        setFormData(updated);
      };

      const handleToggleInterest = (interest) => {
        setFormData((prev) => {
          const exists = prev.preferredInterests.includes(interest);
          return {
            ...prev,
            preferredInterests: exists
              ? prev.preferredInterests.filter((i) => i !== interest)
              : [...prev.preferredInterests, interest]
          };
        });
      };

      const handleAddDestination = (e) => {
        e.preventDefault();
        if (!newDestInput.trim()) return;
        if (!formData.favoriteDestinations.includes(newDestInput.trim())) {
          setFormData((prev) => ({
            ...prev,
            favoriteDestinations: [...prev.favoriteDestinations, newDestInput.trim()]
          }));
        }
        setNewDestInput('');
      };

      const handleRemoveDestination = (dest) => {
        setFormData((prev) => ({
          ...prev,
          favoriteDestinations: prev.favoriteDestinations.filter((d) => d !== dest)
        }));
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        setValidationError('');
        setSaveSuccessMessage('');

        if (!formData.name.trim()) {
          setValidationError('Please enter your full name.');
          return;
        }

        if (!formData.email.trim() || !formData.email.includes('@')) {
          setValidationError('Please enter a valid email address.');
          return;
        }

        if (!formData.password || formData.password.length < 6) {
          setValidationError('Password must be at least 6 characters long.');
          return;
        }

        if (formData.password !== formData.confirmPassword) {
          setValidationError('Password and Confirm Password do not match.');
          return;
        }

        const updatedProfile = {
          ...formData,
          isRegistered: true
        };

        // Save to localStorage and update parent state
        try {
          localStorage.setItem('smarttrip_user_profile', JSON.stringify(updatedProfile));
        } catch (err) {
          console.warn('LocalStorage error', err);
        }

        onUpdateProfile(updatedProfile);
        setSaveSuccessMessage('Profile and credentials updated successfully!');

        if (window.confetti) {
          window.confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
        }

        setTimeout(() => {
          setSaveSuccessMessage('');
        }, 5000);
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 space-y-8 animate-fade-in">
          {/* Header */}
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <span className="text-xs uppercase tracking-widest text-brand-400 font-bold">User Identity & Account</span>
              <h1 className="text-3xl font-extrabold font-heading text-white">Create & Manage Your Profile</h1>
              <p className="text-xs sm:text-sm text-slate-400">Set your name, email, password, and upload a profile picture from your device.</p>
            </div>
            
            <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs font-semibold">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>Account Active & Secured</span>
            </div>
          </div>

          {/* SUCCESS / ERROR ALERTS */}
          {validationError && (
            <div className="glass-card p-4 rounded-2xl border border-red-500/40 bg-red-950/20 text-red-300 text-xs flex items-center gap-2.5 animate-slide-up">
              <Icon name="alert-triangle" className="w-4 h-4 text-red-400 flex-shrink-0" />
              <span>{validationError}</span>
            </div>
          )}

          {saveSuccessMessage && (
            <div className="glass-card p-4 rounded-2xl border border-emerald-500/40 bg-emerald-950/20 text-emerald-300 text-xs flex items-center gap-2.5 animate-slide-up">
              <Icon name="check-circle" className="w-4 h-4 text-emerald-400 flex-shrink-0" />
              <span>{saveSuccessMessage}</span>
            </div>
          )}

          <form onSubmit={handleSaveProfile} className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* LEFT COLUMN: PROFILE CARD & PHOTO UPLOAD */}
            <div className="lg:col-span-4 space-y-6">
              <div className="glass-card p-6 rounded-3xl border border-slate-800 space-y-6 text-center shadow-xl relative overflow-hidden">
                <div className="absolute top-0 right-0 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl pointer-events-none"></div>

                {/* Avatar with Hover Upload Action */}
                <div className="relative w-28 h-28 mx-auto group">
                  <img
                    src={formData.avatar}
                    alt={formData.name || 'User Avatar'}
                    className="w-full h-full rounded-full object-cover border-2 border-brand-400 shadow-xl"
                  />
                  
                  {/* Hover upload overlay */}
                  <button
                    type="button"
                    onClick={() => fileInputRef.current?.click()}
                    className="absolute inset-0 rounded-full bg-navy-950/75 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center text-white transition-all duration-200 cursor-pointer backdrop-blur-xs"
                    title="Click to select image from device"
                  >
                    <Icon name="camera" className="w-6 h-6 text-brand-400 mb-1" />
                    <span className="text-[10px] font-bold text-slate-200">Upload Photo</span>
                  </button>

                  <span className="absolute bottom-1 right-1 w-6 h-6 rounded-full bg-emerald-500 border-2 border-navy-950 flex items-center justify-center pointer-events-none">
                    <Icon name="check" className="w-3.5 h-3.5 text-navy-950" />
                  </span>
                </div>

                {/* Hidden File Input for Device Selection */}
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="image/*"
                  onChange={handleFileUpload}
                  className="hidden"
                />

                {/* Direct Upload Button from Device */}
                <button
                  type="button"
                  onClick={() => fileInputRef.current?.click()}
                  className="w-full py-2.5 px-3 rounded-xl bg-navy-900 hover:bg-slate-800 border border-brand-500/40 text-brand-300 text-xs font-semibold flex items-center justify-center gap-2 transition-all hover:shadow-md hover:shadow-brand-500/10 active:scale-95"
                >
                  <Icon name="upload" className="w-4 h-4 text-brand-400" />
                  <span>Choose Photo from Device</span>
                </button>

                <div>
                  <h3 className="text-xl font-bold font-heading text-white">{formData.name || 'Your Name'}</h3>
                  <p className="text-xs text-slate-400 truncate">{formData.email || 'your.email@domain.com'}</p>
                  <p className="text-xs text-brand-300 font-medium mt-1">Based in {formData.homeCity || 'India'}</p>
                </div>

                {/* Avatar Picker Presets */}
                <div className="space-y-2 text-left pt-2 border-t border-slate-800">
                  <div className="flex items-center justify-between">
                    <p className="text-[11px] text-slate-400 font-semibold uppercase">Or Choose Preset:</p>
                    <span className="text-[10px] text-slate-500">4 Styles</span>
                  </div>
                  <div className="grid grid-cols-4 gap-2">
                    {AVATAR_PRESETS.map((av, idx) => (
                      <img
                        key={idx}
                        src={av.url}
                        alt={av.label}
                        onClick={() => setFormData({ ...formData, avatar: av.url })}
                        className={`w-12 h-12 rounded-xl object-cover cursor-pointer border-2 transition-transform hover:scale-105 ${
                          formData.avatar === av.url ? 'border-brand-400 shadow-md shadow-brand-500/30' : 'border-slate-800 opacity-60 hover:opacity-100'
                        }`}
                        title={av.label}
                      />
                    ))}
                  </div>
                </div>

                {/* Travel Stats */}
                <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800 text-xs">
                  <div className="bg-navy-900/90 p-3 rounded-2xl border border-slate-800">
                    <p className="text-slate-400 text-[10px]">Trips Planned</p>
                    <p className="text-lg font-bold text-white mt-0.5">{formData.totalTripsCount}</p>
                  </div>
                  <div className="bg-navy-900/90 p-3 rounded-2xl border border-slate-800">
                    <p className="text-slate-400 text-[10px]">Budget Saved</p>
                    <p className="text-lg font-bold text-emerald-400 mt-0.5">₹{formData.totalBudgetSaved.toLocaleString('en-IN')}</p>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={onPlanTrip}
                  className="w-full py-3 rounded-2xl text-xs font-bold bg-navy-900 hover:bg-slate-800 border border-slate-700 text-slate-200 flex items-center justify-center gap-2 transition-colors"
                >
                  <Icon name="compass" className="w-4 h-4 text-brand-400" />
                  <span>Launch Trip Wizard</span>
                </button>
              </div>

              {/* Security Note */}
              <div className="glass-card p-4 rounded-2xl border border-slate-800 flex items-center gap-3 text-xs text-slate-400">
                <Icon name="shield-check" className="w-6 h-6 text-brand-400 flex-shrink-0" />
                <p>Uploaded device photos and profile credentials are saved securely in your local browser cache.</p>
              </div>
            </div>

            {/* RIGHT COLUMN: CREDENTIALS & PREFERENCES FORM */}
            <div className="lg:col-span-8 space-y-6">
              
              {/* SECTION 1: ACCOUNT CREDENTIALS (Email, Password, Name) */}
              <div className="glass-card p-6 sm:p-8 rounded-3xl border border-slate-800 space-y-6 shadow-xl">
                <div className="flex items-center gap-3 border-b border-slate-800 pb-4">
                  <div className="w-10 h-10 rounded-xl bg-brand-500/20 text-brand-400 flex items-center justify-center">
                    <Icon name="user" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold font-heading text-white">Account Information</h3>
                    <p className="text-xs text-slate-400">Enter your name, email, and password to establish your profile.</p>
                  </div>
                </div>

                <div className="space-y-4 text-xs">
                  {/* Name & Home City */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-slate-300 font-semibold block mb-1.5">
                        Full Name <span className="text-red-400">*</span>
                      </label>
                      <div className="relative">
                        <Icon name="user" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                        <input
                          type="text"
                          value={formData.name}
                          onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                          placeholder="e.g. Rohan Deshmukh"
                          className="w-full bg-navy-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-white text-xs font-medium focus:outline-none focus:border-brand-400"
                          required
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-slate-300 font-semibold block mb-1.5">Home City / Base Location</label>
                      <div className="relative">
                        <Icon name="map-pin" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                        <input
                          type="text"
                          value={formData.homeCity}
                          onChange={(e) => setFormData({ ...formData, homeCity: e.target.value })}
                          placeholder="e.g. Pune, Mumbai, Delhi, Bengaluru"
                          className="w-full bg-navy-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-white text-xs font-medium focus:outline-none focus:border-brand-400"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Email */}
                  <div>
                    <label className="text-slate-300 font-semibold block mb-1.5">
                      Email Address <span className="text-red-400">*</span>
                    </label>
                    <div className="relative">
                      <Icon name="mail" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                      <input
                        type="email"
                        value={formData.email}
                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        placeholder="e.g. rohan.deshmukh@iitb.ac.in"
                        className="w-full bg-navy-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-white text-xs font-medium focus:outline-none focus:border-brand-400"
                        required
                      />
                    </div>
                  </div>

                  {/* Password & Confirm Password */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <label className="text-slate-300 font-semibold">
                          Password <span className="text-red-400">*</span>
                        </label>
                        <span className={`text-[10px] font-bold ${passwordStrength.color}`}>
                          Strength: {passwordStrength.label}
                        </span>
                      </div>
                      <div className="relative">
                        <Icon name="lock" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                        <input
                          type={showPassword ? "text" : "password"}
                          value={formData.password}
                          onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                          placeholder="••••••••"
                          className="w-full bg-navy-900 border border-slate-700 rounded-xl pl-10 pr-10 py-3 text-white text-xs font-medium focus:outline-none focus:border-brand-400"
                          required
                        />
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                          title={showPassword ? "Hide password" : "Show password"}
                        >
                          <Icon name={showPassword ? "eye-off" : "eye"} className="w-4 h-4" />
                        </button>
                      </div>
                      
                      {/* Strength indicator bar */}
                      <div className="w-full bg-slate-800 h-1 rounded-full mt-2 overflow-hidden">
                        <div className={`h-full transition-all duration-300 ${passwordStrength.bar} ${passwordStrength.width}`}></div>
                      </div>
                    </div>

                    <div>
                      <label className="text-slate-300 font-semibold block mb-1.5">
                        Confirm Password <span className="text-red-400">*</span>
                      </label>
                      <div className="relative">
                        <Icon name="check-square" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                        <input
                          type={showPassword ? "text" : "password"}
                          value={formData.confirmPassword}
                          onChange={(e) => setFormData({ ...formData, confirmPassword: e.target.value })}
                          placeholder="••••••••"
                          className={`w-full bg-navy-900 border rounded-xl pl-10 pr-4 py-3 text-white text-xs font-medium focus:outline-none ${
                            formData.password && formData.confirmPassword && formData.password !== formData.confirmPassword
                              ? 'border-red-500 focus:border-red-400'
                              : 'border-slate-700 focus:border-brand-400'
                          }`}
                          required
                        />
                      </div>
                      {formData.password && formData.confirmPassword && formData.password !== formData.confirmPassword && (
                        <p className="text-[10px] text-red-400 mt-1">Passwords do not match</p>
                      )}
                    </div>
                  </div>
                </div>
              </div>

              {/* SECTION 2: AI TRAVEL PREFERENCES */}
              <div className="glass-card p-6 sm:p-8 rounded-3xl border border-slate-800 space-y-6 shadow-xl">
                <div className="flex items-center gap-3 border-b border-slate-800 pb-4">
                  <div className="w-10 h-10 rounded-xl bg-skybrand-500/20 text-skybrand-400 flex items-center justify-center">
                    <Icon name="sliders" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold font-heading text-white">AI Personalization Settings</h3>
                    <p className="text-xs text-slate-400">Configure default pacing and activity scoring preferences.</p>
                  </div>
                </div>

                {/* AI Toggle Switch */}
                <div className="p-4 rounded-2xl bg-navy-900/80 border border-slate-800 flex items-center justify-between">
                  <div className="space-y-0.5">
                    <h4 className="text-xs font-bold text-white flex items-center gap-2">
                      <span>Use my profile preferences for future recommendations</span>
                      {formData.aiPersonalizationEnabled && (
                        <span className="text-[10px] px-2 py-0.2 rounded-full bg-brand-500/20 text-brand-300 font-bold">
                          Active
                        </span>
                      )}
                    </h4>
                    <p className="text-[11px] text-slate-400">Auto-aligns generator scores to your favorite style and budget threshold.</p>
                  </div>
                  <button
                    type="button"
                    onClick={handleTogglePersonalization}
                    className={`w-12 h-6 rounded-full transition-colors relative flex items-center px-1 flex-shrink-0 ${
                      formData.aiPersonalizationEnabled ? 'bg-brand-500' : 'bg-slate-700'
                    }`}
                  >
                    <div
                      className={`w-4 h-4 rounded-full bg-white transition-transform ${
                        formData.aiPersonalizationEnabled ? 'translate-x-6' : 'translate-x-0'
                      }`}
                    ></div>
                  </button>
                </div>

                {/* Style and Pace dropdowns */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                  <div>
                    <label className="text-slate-300 font-semibold block mb-1.5">Preferred Travel Style</label>
                    <select
                      value={formData.preferredStyle}
                      onChange={(e) => setFormData({ ...formData, preferredStyle: e.target.value })}
                      className="w-full bg-navy-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-brand-400"
                    >
                      <option value="budget">Budget-Friendly (Smart Hostel / Local Food)</option>
                      <option value="balanced">Balanced (Boutique Stay / Mix of Experiences)</option>
                      <option value="comfort">Comfort (Premium Stays / Direct Cabs)</option>
                      <option value="luxury">Luxury (5-Star Resorts / Private Guides)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-300 font-semibold block mb-1.5">Preferred Daily Pace</label>
                    <select
                      value={formData.preferredPace}
                      onChange={(e) => setFormData({ ...formData, preferredPace: e.target.value })}
                      className="w-full bg-navy-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-brand-400"
                    >
                      <option value="relaxed">Relaxed (1-2 curated activities per day)</option>
                      <option value="balanced">Balanced (2-3 activities with leisure time)</option>
                      <option value="packed">Packed (3-4 activities to see everything)</option>
                    </select>
                  </div>
                </div>

                {/* Interests Chips */}
                <div className="space-y-2 text-xs">
                  <label className="text-slate-300 font-semibold block">Favorite Activity Interests (Click to toggle)</label>
                  <div className="flex flex-wrap gap-2">
                    {ALL_INTERESTS.map((interest) => {
                      const isSelected = formData.preferredInterests.includes(interest);
                      return (
                        <button
                          key={interest}
                          type="button"
                          onClick={() => handleToggleInterest(interest)}
                          className={`px-3.5 py-1.5 rounded-xl font-semibold text-xs border transition-all flex items-center gap-1.5 ${
                            isSelected
                              ? 'bg-brand-500/20 border-brand-400 text-brand-300'
                              : 'bg-navy-900 border-slate-800 text-slate-400 hover:border-slate-700 hover:text-white'
                          }`}
                        >
                          <span>{interest}</span>
                          {isSelected ? (
                            <Icon name="check" className="w-3.5 h-3.5 text-brand-400" />
                          ) : (
                            <Icon name="plus" className="w-3.5 h-3.5 text-slate-500" />
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Favorite Destinations Tag Manager */}
                <div className="space-y-2 text-xs pt-1">
                  <label className="text-slate-300 font-semibold block">Bucket-List & Favorite Destinations</label>
                  <div className="flex flex-wrap gap-2 mb-2">
                    {formData.favoriteDestinations.map((dest) => (
                      <span
                        key={dest}
                        className="px-3 py-1 rounded-lg bg-navy-900 border border-slate-700 text-slate-200 flex items-center gap-2"
                      >
                        <span>{dest}</span>
                        <button
                          type="button"
                          onClick={() => handleRemoveDestination(dest)}
                          className="text-slate-400 hover:text-red-400"
                        >
                          <Icon name="x" className="w-3 h-3" />
                        </button>
                      </span>
                    ))}
                  </div>

                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={newDestInput}
                      onChange={(e) => setNewDestInput(e.target.value)}
                      placeholder="Add another destination (e.g. Udaipur, Ladakh)..."
                      className="flex-1 bg-navy-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-brand-400"
                    />
                    <button
                      type="button"
                      onClick={handleAddDestination}
                      className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-white"
                    >
                      Add
                    </button>
                  </div>
                </div>
              </div>

              {/* SAVE PROFILE SUBMIT BUTTON */}
              <div className="flex flex-col sm:flex-row items-center justify-end gap-3 pt-2">
                <button
                  type="submit"
                  className="w-full sm:w-auto px-8 py-3.5 rounded-2xl text-sm font-bold bg-gradient-to-r from-brand-400 to-skybrand-400 text-navy-950 hover:brightness-110 shadow-xl shadow-brand-500/25 active:scale-95 transition-all flex items-center justify-center gap-2"
                >
                  <Icon name="save" className="w-4 h-4 text-navy-950" />
                  <span>Save & Update Profile</span>
                </button>
              </div>

            </div>

          </form>
        </div>
      );
    }

    // ==========================================
    // SHARE REVIEW MODAL
    // ==========================================
    function ShareReviewModal({ currentUser, onClose, onSubmit }) {
      const [destination, setDestination] = useState('Goa');
      const [authorName, setAuthorName] = useState(currentUser?.name || 'Rohan Deshmukh');
      const [authorRole, setAuthorRole] = useState('Solo Backpacker');
      const [rating, setRating] = useState(5);
      const [category, setCategory] = useState('Hidden Gems');
      const [reviewText, setReviewText] = useState('');
      const [tagInput, setTagInput] = useState('#HiddenGem, #Sunset');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!reviewText.trim()) return;
        const tags = tagInput.split(',').map((t) => t.trim()).filter(Boolean);
        onSubmit({
          destination,
          authorName: authorName.trim() || currentUser?.name || 'Anonymous Explorer',
          authorRole: authorRole.trim() || 'Verified Traveler',
          authorAvatar: currentUser?.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80',
          rating: Number(rating),
          category,
          reviewText: reviewText.trim(),
          tags
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-navy-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="glass-card max-w-lg w-full p-6 sm:p-8 rounded-3xl border border-slate-700 shadow-2xl space-y-6 animate-slide-up relative">
            <button
              onClick={onClose}
              className="absolute top-4 right-4 text-slate-400 hover:text-white"
            >
              <Icon name="x" className="w-5 h-5" />
            </button>

            <div className="space-y-1">
              <h3 className="text-xl font-bold font-heading text-white">Share Your Travel Experience</h3>
              <p className="text-xs text-slate-400">Help the AI and fellow travelers discover authentic local experiences.</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 block mb-1">Destination</label>
                  <input
                    type="text"
                    value={destination}
                    onChange={(e) => setDestination(e.target.value)}
                    className="w-full bg-navy-900 border border-slate-700 rounded-xl p-2.5 text-white"
                    required
                  />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Category</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full bg-navy-900 border border-slate-700 rounded-xl p-2.5 text-white"
                  >
                    <option value="Hidden Gems">Hidden Gems</option>
                    <option value="Restaurants">Restaurants</option>
                    <option value="Activities">Activities</option>
                    <option value="Safety">Safety</option>
                    <option value="Accommodation">Accommodation</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 block mb-1">Your Name</label>
                  <input
                    type="text"
                    value={authorName}
                    onChange={(e) => setAuthorName(e.target.value)}
                    className="w-full bg-navy-900 border border-slate-700 rounded-xl p-2.5 text-white"
                  />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Rating (1 - 5 Stars)</label>
                  <select
                    value={rating}
                    onChange={(e) => setRating(Number(e.target.value))}
                    className="w-full bg-navy-900 border border-slate-700 rounded-xl p-2.5 text-white"
                  >
                    <option value="5">★★★★★ (5 - Excellent)</option>
                    <option value="4">★★★★☆ (4 - Very Good)</option>
                    <option value="3">★★★☆☆ (3 - Average)</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="text-slate-400 block mb-1">Your Honest Review & Tips</label>
                <textarea
                  rows="3"
                  value={reviewText}
                  onChange={(e) => setReviewText(e.target.value)}
                  placeholder="Share secret viewpoints, best times to visit, local thali prices..."
                  className="w-full bg-navy-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-brand-400"
                  required
                ></textarea>
              </div>

              <div>
                <label className="text-slate-400 block mb-1">Tags (Comma separated)</label>
                <input
                  type="text"
                  value={tagInput}
                  onChange={(e) => setTagInput(e.target.value)}
                  placeholder="#HiddenGem, #StudentBudget, #Sunset"
                  className="w-full bg-navy-900 border border-slate-700 rounded-xl p-2.5 text-white"
                />
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl font-bold bg-brand-500 text-navy-950 hover:bg-brand-400"
                >
                  Publish Review
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- ERROR BOUNDARY ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("SmartTrip ErrorBoundary caught an error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-navy-950 flex items-center justify-center p-4 text-white">
              <div className="glass-card max-w-md p-8 rounded-3xl border border-red-500/30 text-center space-y-4 shadow-2xl">
                <div className="w-16 h-16 mx-auto rounded-2xl bg-red-500/20 flex items-center justify-center text-red-400">
                  <Icon name="alert-triangle" className="w-8 h-8" />
                </div>
                <h2 className="text-xl font-bold font-heading">Something went wrong</h2>
                <p className="text-xs text-slate-300">The planner encountered an unexpected input state.</p>
                <button
                  onClick={() => {
                    this.setState({ hasError: false });
                    window.location.reload();
                  }}
                  className="px-6 py-2.5 rounded-xl bg-brand-500 text-navy-950 font-bold text-xs hover:bg-brand-400 transition-colors"
                >
                  Reload Application
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- RENDER REACT ROOT ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
