    // --- SMART TRAVEL PHOTO SYSTEM (Original Real Photo with Automatic AI-Generated Visual Fallback) ---
    function getAiGeneratedFallbackUrl(promptText) {
      const cleanPrompt = encodeURIComponent(`cinematic 8k travel photography of ${promptText || 'scenic landmark destination'}, photorealistic, golden hour natural light, vivid colors, highly detailed`);
      return `https://image.pollinations.ai/prompt/${cleanPrompt}?width=800&height=500&nologo=true&seed=42`;
    }

    function SmartTravelPhoto({ src, alt, fallbackPrompt, className = 'w-full h-full object-cover', ...props }) {
      const initialSrc = src || getAiGeneratedFallbackUrl(fallbackPrompt || alt);
      const [imgSrc, setImgSrc] = useState(initialSrc);
      const [hasError, setHasError] = useState(false);

      useEffect(() => {
        setImgSrc(src || getAiGeneratedFallbackUrl(fallbackPrompt || alt));
        setHasError(false);
      }, [src, fallbackPrompt, alt]);

      const handleImageError = () => {
        if (!hasError) {
          setHasError(true);
          setImgSrc(getAiGeneratedFallbackUrl(fallbackPrompt || alt || 'scenic travel sights'));
        }
      };

      return (
        <img
          src={imgSrc}
          alt={alt || 'Travel experience'}
          onError={handleImageError}
          className={className}
          loading="lazy"
          {...props}
        />
      );
    }

          showToast('Regenerated an optimized itinerary with updated recommendations!');
          if (window.confetti) {
            window.confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
          }
        });
      };

      // Trip Generation Logic
      const handleGenerateTrip = (formData) => {
        setPlannerFormData(formData);
        setIsGenerating(true);
        setGeneratingStepIndex(0);

        runGeneratorAnimation(() => {
          const newPlan = generateTripFromFormData(formData);
          setActiveTrip(newPlan);
          setIsGenerating(false);
          setCurrentTab('itinerary');
          showToast(`Generated smart trip to ${formData.destination}!`, 'success');
          if (window.confetti) {
            window.confetti({ particleCount: 80, spread: 90, origin: { y: 0.5 } });
          }
        });
      };

      function runGeneratorAnimation(onComplete) {
        const steps = 5;
        let cur = 0;
        const interval = setInterval(() => {
          cur++;
          setGeneratingStepIndex(cur);
          if (cur >= steps) {
            clearInterval(interval);
            setTimeout(() => {
              onComplete();
            }, 500);
          }
        }, 500);
      }

      function generateTripFromFormData(rawFormData) {
        const formData = rawFormData || {};
        const destNameInput = (formData.destination || 'Goa').trim();
        const safeBudget = Number(formData.budget) || 10000;
        const safeInterests = Array.isArray(formData.interests) && formData.interests.length > 0
          ? formData.interests
          : ['Adventure', 'Nature', 'Food'];
        const safeTravelerType = formData.travelerType || 'student';
        const safeStyle = formData.travelStyle || 'budget';
        const safePace = formData.travelPace || 'balanced';

        // Duration in days
        let duration = 3;
        if (formData.startDate && formData.endDate) {
          const s = new Date(formData.startDate);
          const e = new Date(formData.endDate);
          const diff = Math.ceil((e - s) / (1000 * 60 * 60 * 24)) + 1;
          if (Number.isFinite(diff) && diff > 0) {
            duration = Math.min(14, diff);
          }
        }

        const nights = Math.max(1, duration - 1);

        // Find in DESTINATIONS_DATA or AUTHENTIC_CITY_DATABASE
        const lowerKey = destNameInput.toLowerCase();
        const authenticCity = AUTHENTIC_CITY_DATABASE[lowerKey] || Object.values(AUTHENTIC_CITY_DATABASE).find((c) => c.name.toLowerCase().includes(lowerKey) || lowerKey.includes(c.name.toLowerCase()));

        let dest = DESTINATIONS_DATA.find(
          (d) => d.name.toLowerCase().includes(lowerKey) ||
                 lowerKey.includes(d.name.toLowerCase())
        );

        if (!dest) {
          const formattedName = authenticCity ? authenticCity.name : (destNameInput.charAt(0).toUpperCase() + destNameInput.slice(1));
          dest = {
            id: destNameInput.toLowerCase().replace(/[^a-z0-9]/g, '-'),
            name: formattedName,
            state: authenticCity ? authenticCity.state : 'Destination',
            country: 'India',
            tagline: `Iconic Landmarks, Cultural Trails & Scenic Gems in ${formattedName}`,
            description: `A custom-tailored travel journey in ${formattedName} exploring historic bastions, authentic regional flavors, panoramic viewpoints, and vibrant local bazaars.`,
            image: authenticCity ? authenticCity.coverImage : getAiGeneratedFallbackUrl(`${formattedName} travel destination iconic landmark scenic`),
            popularFor: ['Heritage Sights', 'Local Food Trails', 'Scenic Viewpoints', 'Art & Culture', 'Bazaars'],
            averageDailyCost: { budget: 1800, balanced: 3500, luxury: 8000 },
            bestTimeToVisit: 'October - March',
            rating: 4.8,
            reviewCount: 380
          };
        } else if (authenticCity) {
          dest.image = authenticCity.coverImage;
        }

        // Budget allocation targets (85% total spend, 15% emergency reserve)
        const targetStaySpend = Math.round(safeBudget * 0.38);
        const targetActivitiesSpend = Math.round(safeBudget * 0.28);
        const targetFoodSpend = Math.round(safeBudget * 0.20);
        const targetTransportSpend = Math.round(safeBudget * 0.08);

        const alloc = {
          accommodation: targetStaySpend,
          food: targetFoodSpend,
          activities: targetActivitiesSpend,
          transport: targetTransportSpend,
          emergency: safeBudget - (targetStaySpend + targetFoodSpend + targetActivitiesSpend + targetTransportSpend)
        };

        // Resolve or synthesize authentic activities matching user's destination & real photography
        let pool = ACTIVITIES_DATA.filter((a) => a.destinationId === dest.id);

        if (authenticCity && authenticCity.activities && authenticCity.activities.length > 0) {
          const authActs = authenticCity.activities.map((a, idx) => ({
            id: `act-auth-${dest.id}-${idx}`,
            destinationId: dest.id,
            name: a.name,
            category: a.category,
            description: a.desc,
            timeSlot: a.timeSlot,
            durationHours: 2.5,
            costInr: 600,
            rating: 4.9,
            reviewCount: 380 + idx * 60,
            imageUrl: a.img,
            suitableWeather: ['Sunny', 'Pleasant'],
            suitableTravelers: [safeTravelerType],
            tags: [`#${dest.name}`, `#${a.category}`, `#RealSpot`],
            locationName: `${dest.name} Central Zone`,
            tips: 'Arrive early to avoid crowds and capture stunning natural lighting.'
          }));
          pool = [...authActs, ...pool];
        }

        const totalActivitiesNeeded = duration * 3;

        if (pool.length < totalActivitiesNeeded) {
          // Curated distinct real photography for synthesized items
          const diverseImages = [
            'https://images.unsplash.com/photo-1596178065887-1198b6148b2b?auto=format&fit=crop&w=800&q=80', // Street Bazaar
            'https://images.unsplash.com/photo-1589301760014-d929f3979dbc?auto=format&fit=crop&w=800&q=80', // Street Food
            'https://images.unsplash.com/photo-1599661046289-e31897846e41?auto=format&fit=crop&w=800&q=80', // Fort
            'https://images.unsplash.com/photo-1566552881560-0be86c53e56f?auto=format&fit=crop&w=800&q=80', // Promenade / Sunset
            'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80', // Mountain
            'https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?auto=format&fit=crop&w=800&q=80', // Beach / Coastal
            'https://images.unsplash.com/photo-1590050752117-238cb0fb12b1?auto=format&fit=crop&w=800&q=80', // Artisan crafts
            'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=800&q=80'  // Dining
          ];

          const activityThemes = [
            { name: `${dest.name} Historic Fort & Heritage Walking Tour`, time: 'Morning', cat: 'History' },
            { name: `${dest.name} Traditional Gastronomy & Street Market Crawl`, time: 'Afternoon', cat: 'Food' },
            { name: `${dest.name} Golden Hour Sunset Point & Cultural Performance`, time: 'Evening', cat: 'Culture' },
            { name: `${dest.name} Scenic Mountain Trail & Waterfall Exploration`, time: 'Morning', cat: 'Nature' },
            { name: `${dest.name} Artisan Handicrafts & Old City Bazaars`, time: 'Afternoon', cat: 'Shopping' },
            { name: `${dest.name} Starlit Rooftop Dining & Acoustic Music`, time: 'Evening', cat: 'Nightlife' }
          ];

          const synthesized = activityThemes.map((t, idx) => ({
            id: `act-synth-${dest.id}-${idx}`,
            destinationId: dest.id,
            name: t.name,
            category: t.cat,
            description: `Immerse in the true essence of ${dest.name} with curated experiences, local storytelling, and verified route accessibility.`,
            timeSlot: t.time,
            durationHours: 2.5,
            costInr: 500,
            rating: 4.8,
            reviewCount: 220 + idx * 45,
            imageUrl: diverseImages[idx % diverseImages.length],
            suitableWeather: ['Sunny', 'Pleasant'],
            suitableTravelers: [safeTravelerType],
            tags: [`#${dest.name}`, `#${t.cat}`, `#SmartTrip`],
            locationName: `${dest.name} Center / Historic Zone`,
            tips: `Arrive 15 minutes early to secure prime viewpoints and enjoy morning golden light.`
          }));

          pool = pool.length > 0 ? [...pool, ...synthesized] : synthesized;
        }

        // Scale individual activity costs to spend ~targetActivitiesSpend
        const avgCostPerActivity = Math.max(150, Math.round(targetActivitiesSpend / (duration * 3)));

        // Real hotel photos & options from authentic database or curated hotels
        let availableHotels = authenticCity && authenticCity.hotels ? authenticCity.hotels : [];
        const hotelImages = [
          'https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&w=800&q=80', // Taj / Heritage Palace
          'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80', // Boutique Villa
          'https://images.unsplash.com/photo-1596394516093-501ba68a0ba6?auto=format&fit=crop&w=800&q=80', // Mountain Hostel
          'https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=800&q=80'  // Luxury Resort
        ];

        const nightlyRate = Math.max(850, Math.round(targetStaySpend / nights));

        // Generate Days with Proximity Hotels
        const days = [];
        for (let i = 1; i <= duration; i++) {
          const dayActs = [
            { ...pool[(i * 3) % pool.length], costInr: Math.round(avgCostPerActivity * 0.9) },
            { ...pool[(i * 3 + 1) % pool.length], costInr: Math.round(avgCostPerActivity * 1.2) },
            { ...pool[(i * 3 + 2) % pool.length], costInr: Math.round(avgCostPerActivity * 0.9) }
          ];

          const dayActsCost = dayActs.reduce((acc, a) => acc + (a.costInr || 0), 0);
          const lastActName = dayActs[dayActs.length - 1]?.name || `${dest.name} Center`;

          const hotelOpt = availableHotels[(i - 1) % (availableHotels.length || 1)] || {
            name: `${dest.name} Verified Boutique Stay`,
            type: 'Boutique Heritage Villa',
            price: nightlyRate,
            img: hotelImages[(i - 1) % hotelImages.length],
            loc: `${dest.name} Cultural Quarter`,
            dist: 'Walkable to evening spots'
          };

          const dayNightLodging = {
            id: `hotel-${dest.id}-day-${i}`,
            name: hotelOpt.name,
            type: hotelOpt.type,
            pricePerNight: nightlyRate,
            rating: 4.8,
            reviewCount: 310 + i * 20,
            location: hotelOpt.loc || `${dest.name} Center`,
            distance: `350m from ${lastActName.split(' ')[0]}`,
            image: hotelOpt.img,
            amenities: ['High-speed WiFi', 'AC Rooms', 'Hot Breakfast', '24/7 Front Desk', 'Proximity to Sights'],
            whyRecommended: `Situated directly in ${dest.name} near Day ${i}'s evening spots for zero night commute.`
          };

          days.push({
            dayNumber: i,
            date: `Day ${i}`,
            title: `Day ${i}: ${dest.name} Highlights & ${hotelOpt.loc || 'City Center'}`,
            weather: {
              condition: i % 2 === 0 ? 'Pleasant' : 'Sunny',
              tempC: 28,
              icon: 'sun',
              note: `Pleasant weather in ${dest.name}: Great for outdoor discovery.`
            },
            activities: dayActs,
            dailyCost: dayActsCost,
            nightLodging: dayNightLodging
          });
        }

        // Primary lodging
        const destHotels = HOTELS_DATA.filter((h) => h.destinationId === dest.id);
        const lodgingPref = formData.lodgingStyle || safeStyle;
        const matchedHotel = destHotels.find((h) => h.tier === lodgingPref) || destHotels[0] || (availableHotels[0] ? {
          id: `hotel-${dest.id}-primary`,
          destinationId: dest.id,
          name: availableHotels[0].name,
          type: availableHotels[0].type,
          tier: safeStyle,
          pricePerNight: nightlyRate,
          rating: 4.9,
          reviewCount: 520,
          location: availableHotels[0].loc,
          distance: availableHotels[0].dist,
          image: availableHotels[0].img,
          amenities: ['High-Speed WiFi', 'Swimming Pool', 'Complimentary Breakfast', 'AC Rooms', 'Tour Desk'],
          whyRecommended: 'Top verified property offering prime location, high safety ratings, and authentic ambiance.'
        } : {
          id: `hotel-${dest.id}-primary`,
          destinationId: dest.id,
          name: `${dest.name} Grand Heritage & Leisure Stay`,
          type: safeStyle === 'luxury' ? '5-Star Luxury Resort' : safeStyle === 'comfort' ? 'Boutique Homestay' : 'Eco Cottage / Hostel',
          tier: safeStyle,
          pricePerNight: nightlyRate,
          rating: 4.8,
          reviewCount: 450,
          location: `${dest.name} Central Zone`,
          distance: `Walkable to central highlights`,
          image: hotelImages[0],
          amenities: ['High-Speed WiFi', 'Swimming Pool', 'Complimentary Breakfast', 'AC Rooms', 'Tour Desk'],
          whyRecommended: `Top rated stay in ${dest.name} matched to your ${safeStyle} travel style.`
        });

        const hotelWithCost = {
          ...matchedHotel,
          pricePerNight: nightlyRate,
          nightsCount: nights,
          totalStayCost: nightlyRate * nights
        };

        const totalTripSpend = hotelWithCost.totalStayCost + days.reduce((sum, d) => sum + d.dailyCost, 0) + targetFoodSpend + targetTransportSpend;

        return {
          id: `trip-${Date.now()}`,
          destination: dest.name,
          destinationDetails: dest,
          startDate: formData.startDate || '2026-10-15',
          endDate: formData.endDate || '2026-10-18',
          durationDays: duration,
          totalBudget: safeBudget,
          totalTripSpend,
          travelerType: safeTravelerType,
          interests: safeInterests,
          travelStyle: safeStyle,
          travelPace: safePace,
          lodgingStyle: lodgingPref,
          lodging: hotelWithCost,
          summary: `Personalized trip to ${dest.name} for ₹${safeBudget.toLocaleString('en-IN')} budget with ${Math.round((totalTripSpend / safeBudget) * 100)}% optimized spend across handpicked stays, curated activities, and dining.`,
          budgetAllocation: alloc,
          priceSpike: {
            item: `${dest.name} Peak Season Stay`,
            originalPrice: nightlyRate,
            currentPrice: Math.round(nightlyRate * 1.35),
            spikeAmount: Math.round(nightlyRate * 0.35),
            suggestedAlternative: {
              name: `${dest.name} Verified Eco Boutique`,
              price: nightlyRate,
              rating: 4.7,
              distance: '400m from center'
            }
          },
          days,
          createdAt: new Date().toISOString(),
          status: 'Upcoming'
        };
      }

      return (
        <div className="flex flex-col min-h-screen">
          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-40 bg-navy-950/80 backdrop-blur-md border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              {/* Brand Logo */}
              <div 
                onClick={() => setCurrentTab('home')}
                className="flex items-center gap-3 cursor-pointer group"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-500 to-skybrand-400 flex items-center justify-center shadow-lg shadow-brand-500/20 group-hover:scale-105 transition-transform">
                  <Icon name="compass" className="w-6 h-6 text-navy-950" />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-xl font-bold font-heading tracking-tight text-white">SmartTrip</span>
                    <span className="text-xs px-2 py-0.5 rounded-full font-bold bg-brand-500/20 text-brand-300 border border-brand-500/30">AI</span>
                  </div>
                  <p className="text-[10px] text-slate-400 tracking-wider uppercase font-medium">Personalized Trip Engine</p>
                </div>
              </div>

              {/* Desktop Navigation */}
              <nav className="hidden md:flex items-center gap-1 bg-navy-900/60 p-1.5 rounded-2xl border border-slate-800">
                {[
                  { id: 'home', label: 'Home', icon: 'home' },
                  { id: 'plan', label: 'Plan a Trip', icon: 'sparkles' },
                  { id: 'itinerary', label: 'AI Itinerary', icon: 'calendar' },
                  { id: 'budget', label: 'Budget', icon: 'pie-chart' },
                  { id: 'community', label: 'Community', icon: 'users' },
                  { id: 'trips', label: 'My Trips', icon: 'bookmark', count: savedTrips.length },
                  { id: 'profile', label: 'Profile', icon: 'user' }
                ].map((item) => {
                  const isActive = currentTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setCurrentTab(item.id)}
                      className={`px-3.5 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-2 relative ${
                        isActive
                          ? 'bg-gradient-to-r from-brand-600 to-brand-500 text-white shadow-md shadow-brand-500/25'
                          : 'text-slate-300 hover:text-white hover:bg-slate-800/60'
                      }`}
                    >
                      <Icon name={item.icon} className={`w-4 h-4 ${isActive ? 'text-white' : 'text-slate-400'}`} />
                      <span>{item.label}</span>
                      {item.count !== undefined && item.count > 0 && (
                        <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${
                          isActive ? 'bg-navy-950 text-brand-300' : 'bg-slate-800 text-slate-300'
                        }`}>
                          {item.count}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* Header Right Action */}
              <div className="hidden lg:flex items-center gap-3">
                <button
                  onClick={() => setCurrentTab('plan')}
                  className="px-5 py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-skybrand-500 to-brand-500 text-navy-950 hover:brightness-110 shadow-lg shadow-skybrand-500/20 active:scale-95 transition-all flex items-center gap-2"
                >
                  <Icon name="sparkles" className="w-4 h-4 text-navy-950" />
                  <span>Plan My Trip</span>
                </button>
              </div>

              {/* Mobile Hamburger Menu */}
              <div className="md:hidden flex items-center gap-2">
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="p-2 rounded-lg bg-navy-900 border border-slate-800 text-slate-300 hover:text-white"
                >
                  <Icon name={mobileMenuOpen ? 'x' : 'menu'} className="w-6 h-6" />
                </button>
              </div>
            </div>

            {/* Mobile Drawer */}
            {mobileMenuOpen && (
              <div className="md:hidden bg-navy-900 border-b border-slate-800 px-4 py-4 space-y-2 animate-fade-in">
                {[
                  { id: 'home', label: 'Home', icon: 'home' },
                  { id: 'plan', label: 'Plan a Trip', icon: 'sparkles' },
                  { id: 'itinerary', label: 'AI Itinerary', icon: 'calendar' },
                  { id: 'budget', label: 'Budget Optimizer', icon: 'pie-chart' },
                  { id: 'community', label: 'Community Feedback', icon: 'users' },
                  { id: 'trips', label: 'My Saved Trips', icon: 'bookmark', count: savedTrips.length },
                  { id: 'profile', label: 'Profile & Preferences', icon: 'user' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => {
                      setCurrentTab(item.id);
                      setMobileMenuOpen(false);
                    }}
                    className={`w-full px-4 py-3 rounded-xl text-left font-medium flex items-center justify-between ${
                      currentTab === item.id
                        ? 'bg-brand-600 text-white'
                        : 'text-slate-300 hover:bg-slate-800/80'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <Icon name={item.icon} className="w-5 h-5" />
                      <span>{item.label}</span>
                    </div>
                    {item.count && (
                      <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 font-bold">
                        {item.count}
                      </span>
                    )}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* MAIN VIEW CONTROLLER */}
          <main className="flex-grow">
            {currentTab === 'home' && (
              <HomeView
                onPlanTrip={() => setCurrentTab('plan')}
                onLaunchDemo={handleLaunchDemo}
                onExploreDestination={(destName) => {
                  setPlannerFormData((prev) => ({ ...prev, destination: destName }));
                  setCurrentTab('plan');
                }}
              />
            )}

            {currentTab === 'plan' && (
              <PlanWizardView
                initialData={plannerFormData}
                onGenerate={handleGenerateTrip}
                onCancel={() => setCurrentTab('home')}
              />
            )}

            {currentTab === 'itinerary' && (
              <ItineraryDashboardView
                trip={activeTrip}
                onSave={handleSaveCurrentTrip}
                onEdit={() => handleEditTrip(activeTrip)}
                onRegenerate={handleRegenerateTrip}
                onOpenBudget={() => setCurrentTab('budget')}
                onSelectActivity={(act) => setSelectedActivity(act)}
                onShare={() => {
                  if (navigator.clipboard) {
                    navigator.clipboard.writeText(window.location.href);
                  }
                  showToast('Sharable trip link copied to clipboard!');
                }}
              />
            )}

            {currentTab === 'budget' && (
              <BudgetOptimizerView
                trip={activeTrip}
                expenses={expenses}
                hasSwitchedHotel={hasSwitchedHotel}
                onSwitchAlternative={handleSwitchToAlternative}
                onAddExpense={handleAddExpense}
                onDeleteExpense={handleDeleteExpense}
                onBackToItinerary={() => setCurrentTab('itinerary')}
              />
            )}

            {currentTab === 'community' && (
              <CommunityFeedbackView
                reviews={reviews}
                onLikeReview={handleLikeReview}
                onOpenAddReview={() => setShowReviewModal(true)}
              />
            )}

            {currentTab === 'trips' && (
              <MyTripsView
                savedTrips={savedTrips}
                onViewTrip={(trip) => {
                  setActiveTrip(trip);
                  setCurrentTab('itinerary');
                }}
                onEditTrip={(trip) => handleEditTrip(trip)}
                onDeleteTrip={handleDeleteTrip}
                onCreateNew={() => setCurrentTab('plan')}
              />
            )}

            {currentTab === 'profile' && (
              <ProfilePreferencesView
                profile={userProfile}
                onUpdateProfile={(updated) => {
                  setUserProfile(updated);
                  showToast('Travel preferences saved successfully!');
                }}
                onPlanTrip={() => setCurrentTab('plan')}
              />
            )}
          </main>

          {/* AI GENERATING OVERLAY MODAL */}
          {isGenerating && (
            <div className="fixed inset-0 z-50 bg-navy-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card max-w-md w-full p-8 rounded-3xl border border-brand-500/30 text-center shadow-2xl animate-fade-in relative overflow-hidden">
                <div className="absolute -top-20 -left-20 w-40 h-40 bg-brand-500/20 rounded-full blur-3xl pointer-events-none"></div>
                <div className="absolute -bottom-20 -right-20 w-40 h-40 bg-skybrand-500/20 rounded-full blur-3xl pointer-events-none"></div>

                <div className="w-20 h-20 mx-auto mb-6 rounded-2xl bg-gradient-to-tr from-brand-600 to-skybrand-500 flex items-center justify-center animate-pulse">
                  <Icon name="sparkles" className="w-10 h-10 text-navy-950" />
                </div>

                <h3 className="text-2xl font-bold font-heading text-white mb-2">
                  AI is Designing Your Trip...
                </h3>
                <p className="text-sm text-slate-300 mb-6">
                  Applying scoring models, weather adaptation and budget allocation.
                </p>

                {/* Stepped progress indicators */}
                <div className="space-y-3 text-left mb-6">
                  {[
                    "Checking traveler preferences & style...",
                    "Analyzing activities & local weather forecasts...",
                    "Optimizing budget allocation (40% stay, 35% food, 25% thrill)...",
                    "Synthesizing community reviews & hidden gems...",
                    "Finalizing your day-by-day smart itinerary..."
                  ].map((stepText, idx) => {
                    const isDone = idx < generatingStepIndex;
                    const isCurrent = idx === generatingStepIndex;
                    return (
                      <div
                        key={idx}
                        className={`flex items-center gap-3 p-2.5 rounded-xl transition-all ${
                          isCurrent
                            ? 'bg-brand-500/10 border border-brand-500/40 text-brand-300'
                            : isDone
                            ? 'text-slate-400'
                            : 'text-slate-600 opacity-40'
                        }`}
                      >
                        {isDone ? (
                          <Icon name="check-circle" className="w-4 h-4 text-brand-400" />
                        ) : isCurrent ? (
                          <div className="w-4 h-4 rounded-full border-2 border-brand-400 border-t-transparent animate-spin"></div>
                        ) : (
                          <div className="w-4 h-4 rounded-full border border-slate-700"></div>
                        )}
                        <span className="text-xs font-medium">{stepText}</span>
                      </div>
                    );

    function PlanWizardView({ initialData, onGenerate, onCancel }) {
      const [formData, setFormData] = useState({
        destination: initialData?.destination || 'Goa',
        startDate: initialData?.startDate || '2026-10-15',
        endDate: initialData?.endDate || '2026-10-18',
        budget: Number(initialData?.budget) || 10000,
        travelerType: initialData?.travelerType || 'student',
        interests: Array.isArray(initialData?.interests) ? initialData.interests : ['Adventure', 'Nature', 'Food'],
        travelStyle: initialData?.travelStyle || 'budget',
        travelPace: initialData?.travelPace || 'balanced'
      });
      const [step, setStep] = useState(1);

      const INTEREST_OPTIONS = [
        'Adventure', 'Nature', 'Food', 'History', 'Culture',
        'Shopping', 'Nightlife', 'Photography', 'Relaxation', 'Hidden Gems'
      ];

      const TRAVELER_TYPES = [
        { id: 'student', title: 'Student', desc: 'Affordable, flexible, hostels & thrill', icon: 'graduation-cap' },
        { id: 'couple', title: 'Couple', desc: 'Scenic sunsets, romantic dining & comfort', icon: 'heart' },
        { id: 'family', title: 'Family', desc: 'Kid-friendly, safe venues & spacious stays', icon: 'home' },
        { id: 'solo', title: 'Solo', desc: 'Authentic local culture & offbeat spots', icon: 'user' },
        { id: 'friends', title: 'Friends', desc: 'Group fun, nightlife & adventure sports', icon: 'users' }
      ];

      const handleToggleInterest = (item) => {
        setFormData((prev) => {
          const currentList = Array.isArray(prev.interests) ? prev.interests : [];
          const exists = currentList.includes(item);
          return {
            ...prev,
            interests: exists ? currentList.filter((i) => i !== item) : [...currentList, item]
          };
        });
      };

      const handleSurpriseMe = () => {
        const dests = ['Goa', 'Mumbai', 'Delhi', 'Jaipur', 'Manali', 'Kerala', 'Varanasi', 'Agra', 'Shimla', 'Udaipur', 'Rishikesh', 'Amritsar', 'Darjeeling', 'Ooty'];
        const randomDest = dests[Math.floor(Math.random() * dests.length)];
        setFormData((prev) => ({ ...prev, destination: randomDest }));
      };

      // Calculate Duration Days safely
      const durationDays = useMemo(() => {
        if (!formData.startDate || !formData.endDate) return 3;
        try {

    // ==========================================
    // PAGE 3: AI GENERATED ITINERARY DASHBOARD (With Night Lodging & Hotels)
    // ==========================================
    function ItineraryDashboardView({ trip, onSave, onEdit, onRegenerate, onOpenBudget, onSelectActivity, onShare }) {
      const [activeDayIndex, setActiveDayIndex] = useState(1);
      const [mapViewActive, setMapViewActive] = useState(false);
      const [showHotelModal, setShowHotelModal] = useState(false);
      const [currentLodging, setCurrentLodging] = useState(() => {
        if (trip?.lodging) return trip.lodging;
        const destId = (trip?.destination || 'goa').toLowerCase();
        const found = HOTELS_DATA.find((h) => h.destinationId === destId) || HOTELS_DATA[0];
        const nights = Math.max(1, (trip?.durationDays || 3) - 1);
        return { ...found, nightsCount: nights, totalStayCost: found.pricePerNight * nights };
      });

      if (!trip || !trip.days || trip.days.length === 0) {
        return (
          <div className="max-w-4xl mx-auto px-4 py-20 text-center space-y-4">
            <h2 className="text-2xl font-bold text-white">No Generated Itinerary Yet</h2>
            <p className="text-sm text-slate-400">Launch the trip planner to configure your smart trip.</p>
          </div>
        );
      }

      const activeDay = trip.days.find((d) => d.dayNumber === activeDayIndex) || trip.days[0];
      const nightsCount = Math.max(1, (trip.durationDays || 3) - 1);
      const destHotels = HOTELS_DATA.filter((h) => h.destinationId.toLowerCase() === (trip.destination || '').toLowerCase());
      const availableHotels = destHotels.length > 0 ? destHotels : HOTELS_DATA.slice(0, 3);

      // Download formatted text
      const handleDownload = () => {
        let textContent = `SMARTTRIP AI ITINERARY & LODGING\nDestination: ${trip.destination}\nDuration: ${trip.durationDays} Days / ${nightsCount} Nights\nBudget: ₹${trip.totalBudget}\nTraveler Type: ${trip.travelerType}\n\n`;
        textContent += `===================\nRECOMMENDED NIGHT LODGING & STAY:\nHotel: ${currentLodging.name} (${currentLodging.type})\nRate: ₹${currentLodging.pricePerNight}/night • Total: ₹${currentLodging.pricePerNight * nightsCount}\nLocation: ${currentLodging.location} (${currentLodging.distance})\nAmenities: ${(currentLodging.amenities || []).join(', ')}\n\n`;
        trip.days.forEach((d) => {
          textContent += `\n===================\nDAY ${d.dayNumber}: ${d.title}\nWeather: ${d.weather.condition} (${d.weather.tempC}°C) - ${d.weather.note}\n`;
          d.activities.forEach((a) => {

    function CommunityFeedbackView({ reviews, onLikeReview, onOpenAddReview }) {
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedSort, setSelectedSort] = useState('Highest Rated');
      const [searchQuery, setSearchQuery] = useState('');

      const CATEGORIES = ['All', 'Hidden Gems', 'Restaurants', 'Activities', 'Safety', 'Accommodation'];

      const filteredReviews = useMemo(() => {
        return reviews
          .filter((r) => {
            const matchesCat = selectedCategory === 'All' || r.category === selectedCategory;
            const matchesSearch =
              r.destination.toLowerCase().includes(searchQuery.toLowerCase()) ||
              r.reviewText.toLowerCase().includes(searchQuery.toLowerCase()) ||
              r.tags.some((t) => t.toLowerCase().includes(searchQuery.toLowerCase()));
            return matchesCat && matchesSearch;
          })
          .sort((a, b) => {
            if (selectedSort === 'Highest Rated') return b.rating - a.rating;
            if (selectedSort === 'Most Helpful') return b.likesCount - a.likesCount;
            return 0;
          });
      }, [reviews, selectedCategory, selectedSort, searchQuery]);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 animate-fade-in">

              onClick={onOpenAddReview}

            {/* Search */}
            <div className="relative w-full md:w-80">
              <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search reviews, #tags, or destinations..."

              />

                      ? 'bg-brand-500 text-navy-950'

                  {cat}
                </button>
              ))}

            {/* Sort */}
            <div className="flex items-center gap-2 self-end md:self-auto text-xs">
              <span className="text-slate-400">Sort:</span>

              >

                        className="w-11 h-11 rounded-full object-cover border border-brand-500/30"
                      />
                      <div>
                        <h4 className="text-sm font-bold text-white">{rev.authorName}</h4>
                        <p className="text-[11px] text-slate-400">{rev.authorRole}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-bold">
                      ★ {rev.rating}.0
                    </div>
                  </div>

                  {/* Destination Tag */}
                  <div className="flex items-center gap-2">
                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-brand-500/20 text-brand-300">
